name: tests

on:
  push:
    branches: ["**"]   # branch pushes only; tag pushes reuse a commit that was already tested
  pull_request:

permissions:
  contents: read

jobs:
  notebooks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # Day 04 downloads its embedding model (133 MB) and Day 09 its reranker (91 MB) into models/. Keep them
      # between runs instead of fetching them from Hugging Face on every push. The key names every pinned
      # revision, so a new pin downloads once (restore-keys brings back the older models meanwhile), and the
      # notebooks still verify every file's SHA-256.
      - name: Cache the models
        uses: actions/cache@v6
        with:
          path: models
          key: models-${{ runner.os }}-bge-small-en-v1.5-5c38ec7c405ec4b44b94cc5a9bb96e735b38267a-ms-marco-MiniLM-L-6-v2-a09144355adeed5f58c8ed011d209bf8ee5a1fec
          restore-keys: |
            models-${{ runner.os }}-bge-small-en-v1.5-5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
      - name: Execute notebooks and run tests
        run: python -m pytest
